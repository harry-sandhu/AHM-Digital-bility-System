# Runs on the VPS:  cp .env.example .env  (edit it)  &&  docker compose up -d
# Only Caddy is reachable from the internet (ports 80/443). The backend and the
# OCR service live on the private compose network.
# Docker keeps container logs forever by default; cap them so they can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # keeps the HTTPS certificates across restarts
      - caddy_config:/config
    logging: *logging
    depends_on:
      - backend

  backend:
    image: ghcr.io/${GITHUB_OWNER}/bilty-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "5000"
      OCR_SERVICE_URL: http://ocr:8787
      OCR_SERVICE_KEY: ${OCR_KEY}
    expose:
      - "5000"
    mem_limit: 400m          # idle ~100 MB; sized so everything fits a 2 GB server
    logging: *logging
    depends_on:
      - ocr

  ocr:
    image: ghcr.io/${GITHUB_OWNER}/bilty-ocr:latest
    restart: unless-stopped
    environment:
      OCR_KEY: ${OCR_KEY}
      # This VPS's CPU has no AVX and the host steals ~40% of it: the accurate model took 70-110 s per scan,
      # the light one ~5 s (97% vs 100% of fields on the test photos). Delete these two lines to go back to
      # the accurate model once the server has a proper CPU.
      OCR_MODEL_DIR: /app/models-light
      OCR_REC_HEIGHT: "32"
    expose:
      - "8787"
    mem_limit: 900m          # peaks ~550 MB while reading a photo
    cpu_shares: 256          # lower CPU priority than the backend (default 1024), so logins/saves stay snappy
                             # while a scan runs. (Not a hard `cpus:` quota: that throttles the OCR badly.)
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
