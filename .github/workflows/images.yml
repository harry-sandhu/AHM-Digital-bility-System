name: Build images

# Builds the backend and OCR service images on GitHub (not on the small VPS,
# where compiling the Rust backend can run out of memory) and publishes them to
# GitHub Container Registry for `docker compose pull` on the server.
#
# - push to `main`       -> builds the images (tagged with the commit), nothing is deployed
# - push to `production` -> builds them, tags `latest`, then updates the VPS (deploy job below)
on:
  push:
    branches: [main, production]
    paths:
      - "backend-rust/**"
      - "ocr-service/**"
      - "deploy/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bilty-backend
            context: backend-rust
          - name: bilty-ocr
            context: ocr-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # `latest` is what the server runs, so only the production branch moves it.
          tags: |
            ${{ github.ref == 'refs/heads/production' && format('ghcr.io/{0}/{1}:latest', github.repository_owner, matrix.name) || '' }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    # Only the production branch goes live, and only after both images built.
    if: github.ref == 'refs/heads/production'
    needs: build
    runs-on: ubuntu-latest
    concurrency: deploy-vps   # never two deploys at once
    steps:
      - name: Update the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key on the server is locked to one command (deploy.sh), so whatever is passed here is ignored.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" deploy
